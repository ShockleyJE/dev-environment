# Kernel and NVIDIA driver updates are applied by hand, never by
# unattended-upgrades.
#
# unattended-upgrades installs from noble-security only. Ubuntu's signed NVIDIA
# module for a new kernel (linux-modules-nvidia-<branch>-<kver>-generic) often
# depends on an nvidia-kernel-common version that exists only in noble-updates,
# so the robot installed the new kernel, could not install its module, and the
# next boot landed on a kernel with no nvidia.ko (no CUDA, no NVENC, no
# nvidia-smi) until someone ran a full upgrade by hand. That happened for
# 6.17.0-23, -29, -35, 7.0.0-28 and 7.0.0-34.
#
# The blacklist only affects unattended-upgrades; it is not an apt-mark hold,
# so `sudo apt update && sudo apt full-upgrade` still moves these packages, and
# because it uses every pocket it brings each kernel together with its NVIDIA
# module and the driver that module needs. The NVIDIA userland is listed too because it must match the kernel
# module version exactly; letting it update alone would break nvidia-smi with a
# driver/library version mismatch. Its package list mirrors the driver universe
# pinned in tasks/cuda.yml. linux-firmware, linux-libc-dev and linux-tools-common
# do not depend on the kernel ABI and stay automatic.
- name: Keep kernel and NVIDIA driver packages out of unattended-upgrades
  copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-kernel-by-hand
    content: |
      // Managed by dev-environment Ansible playbook (tasks/kernel-updates.yml).
      // Kernel and NVIDIA driver updates are manual: `sudo apt update && sudo apt full-upgrade`.
      Unattended-Upgrade::Package-Blacklist {
          "linux-generic";
          "linux-image-";
          "linux-headers-";
          "linux-modules-";
          "linux-main-modules-";
          "linux-objects-";
          "linux-signatures-";
          "linux-hwe-";
          "linux-tools-[0-9]";
          "nvidia-driver-";
          "nvidia-kernel-common-";
          "nvidia-kernel-source-";
          "nvidia-dkms-";
          "nvidia-utils-";
          "nvidia-firmware-";
          "nvidia-compute-utils-";
          "libnvidia-";
          "xserver-xorg-video-nvidia-";
          "cuda-drivers";
      };
    mode: '0644'
    owner: root
    group: root
    validate: apt-config -c %s dump
  become: true
  when: ansible_facts.distribution == "Ubuntu"
  tags:
    - install
    - kernel
